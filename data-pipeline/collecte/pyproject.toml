[project]
name = "moteur-scraper"
version = "1.0.0"
description = "Collecte respectueuse des fiches voitures neuves de moteur.ma pour vérifier le catalogue AutoAssist (usage local)."
requires-python = ">=3.11"
dependencies = [
  "requests==2.34.2",
  "beautifulsoup4==4.15.0",
  "pandas==3.1.1",
  "pyarrow==26.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[project.scripts]
moteur-scraper = "moteur_scraper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# La longueur des lignes est gérée par « ruff format » (chaînes longues tolérées).
ignore = ["E501"]
